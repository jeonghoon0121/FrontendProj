<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카세트 퓨처리즘</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0c0c0c;
      font-family: 'Orbitron', sans-serif;
      color: #33ff99;
      overflow: hidden;
    }
    .container {
      padding: 40px;
      max-width: 800px;
      margin: auto;
      border: 2px solid #33ff99;
      box-shadow: 0 0 20px #00ffcc;
      background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
    }
    h1 {
      font-size: 48px;
      text-align: center;
      text-shadow: 0 0 10px #33ff99;
    }
    .panel {
      background-color: #121212;
      padding: 20px;
      margin-top: 30px;
      border: 1px solid #33ff99;
      box-shadow: inset 0 0 10px #00ffcc;
    }
    button {
      background-color: #000;
      color: #33ff99;
      border: 2px solid #33ff99;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }
    button:hover {
      background-color: #33ff99;
      color: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CASSETTE FUTURISM</h1>
    <div class="panel">
      <p>디지털이 아날로그를 만났을 때 — 우리는 미래를 테이프에 담는다.</p>
      <button>시작하기</button>
    </div>
  </div>
</body>
</html>
