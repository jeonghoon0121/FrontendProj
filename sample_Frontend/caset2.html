<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cassette Futurism Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #b2f5ea;
      font-family: 'Share Tech Mono', monospace;
    }
    .frame {
      max-width: 700px;
      margin: 60px auto;
      padding: 40px;
      border: 1px solid #666;
      background: linear-gradient(to bottom right, #1a1a1a, #000);
      box-shadow: 0 0 20px #00ffd0 inset;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 20px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }
    p {
      line-height: 1.6;
      font-size: 16px;
    }
    .btn {
      margin-top: 30px;
      padding: 12px 20px;
      background-color: transparent;
      color: #b2f5ea;
      border: 1px solid #b2f5ea;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #b2f5ea;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Interface Loaded</h1>
    <p>아날로그 회로와 미래 상상이 교차하는 시점.  
    불필요한 장식은 제거하고, 기능만 남겼다.</p>
    <button class="btn">ACCESS SYSTEM</button>
  </div>
</body>
</html>
